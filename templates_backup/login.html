<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Vanshuuu Store</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(229, 9, 20, 0.22),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom left,
                    rgba(150, 0, 0, 0.14),
                    transparent 35%
                ),
                #050505;

            color: white;
            font-family: Arial, sans-serif;
        }


        /* BACKGROUND GLOW */

        body::before {
            content: "";
            position: fixed;
            width: 250px;
            height: 250px;

            background: rgba(255, 0, 0, 0.12);

            filter: blur(90px);

            top: 10%;
            left: 10%;

            pointer-events: none;
        }


        /* LOGIN CARD */

        .login-card {
            width: 100%;

            background:
                linear-gradient(
                    145deg,
                    rgba(35, 35, 35, 0.96),
                    rgba(8, 8, 8, 0.98)
                );

            border: 1px solid rgba(255, 40, 40, 0.3);

            border-radius: 24px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.7),
                0 0 35px rgba(255, 0, 0, 0.08);

            overflow: hidden;

            transition: 0.35s;
        }

        .login-card:hover {
            transform: translateY(-4px);

            border-color: rgba(255, 40, 40, 0.55);

            box-shadow:
                0 30px 70px rgba(0, 0, 0, 0.8),
                0 0 40px rgba(255, 0, 0, 0.14);
        }


        /* LOGO */

        .store-logo {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: white;
        }

        .store-logo span {
            color: #ff3030;
        }


        /* ICON */

        .login-icon {
            width: 70px;
            height: 70px;

            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    #ff3030,
                    #8b0000
                );

            font-size: 30px;

            box-shadow:
                0 0 25px rgba(255, 0, 0, 0.3),
                inset 0 2px 5px rgba(255,255,255,0.15);
        }


        /* TITLE */

        .login-title {
            font-size: 2rem;
            font-weight: 800;
        }

        .login-title span {
            color: #ff3030;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
        }


        /* FORM */

        .form-label {
            color: #ddd;
            font-weight: 600;
        }

        .form-control {
            background: #111 !important;

            border: 1px solid #333 !important;

            color: white !important;

            border-radius: 11px;

            padding: 12px 14px;
        }

        .form-control::placeholder {
            color: #666;
        }

        .form-control:focus {
            border-color: #e50914 !important;

            box-shadow:
                0 0 12px rgba(229, 9, 20, 0.25) !important;
        }


        /* LOGIN BUTTON */

        .login-btn {
            background:
                linear-gradient(
                    135deg,
                    #ff3030,
                    #b30000
                );

            border: none;

            color: white;

            font-weight: 800;

            padding: 13px;

            border-radius: 11px;

            transition: 0.3s;

            box-shadow:
                0 8px 22px rgba(220, 0, 0, 0.22);
        }

        .login-btn:hover {
            color: white;

            transform: translateY(-2px);

            box-shadow:
                0 12px 30px rgba(255, 0, 0, 0.4);
        }


        /* MESSAGES */

        .alert-danger {
            background: rgba(220, 38, 38, 0.12);

            border: 1px solid rgba(255, 50, 50, 0.3);

            color: #ff6969;

            border-radius: 10px;
        }


        /* REGISTER */

        .register-text {
            color: #888;
        }

        .register-link {
            color: #ff4040;

            text-decoration: none;

            font-weight: 700;
        }

        .register-link:hover {
            color: #ff7777;
            text-decoration: underline;
        }


        /* SECURITY */

        .secure-text {
            color: #666;

            font-size: 12px;

            text-align: center;

            margin-top: 20px;
        }


        /* MOBILE */

        @media (max-width: 576px) {

            .login-wrapper {
                padding: 20px;
            }

            .login-title {
                font-size: 1.7rem;
            }

        }

    </style>

</head>


<body>


<div class="container login-wrapper">

    <div class="row justify-content-center">

        <div class="col-sm-10 col-md-7 col-lg-5">

            <div class="login-card">

                <div class="p-4 p-md-5">


                    <!-- LOGO -->

                    <div class="text-center mb-4">

                        <div class="store-logo">
                            🛍️ Vanshuuu <span>Store</span>
                        </div>

                    </div>


                    <!-- ICON -->

                    <div class="login-icon">
                        🔐
                    </div>


                    <!-- TITLE -->

                    <h2 class="login-title text-center">
                        Welcome <span>Back</span>
                    </h2>

                    <p class="subtitle text-center mb-4">
                        Login to continue shopping
                    </p>


                    <!-- MESSAGES -->

                    {% for message in messages %}

                        <div class="alert alert-danger">

                            {{ message }}

                        </div>

                    {% endfor %}


                    <!-- FORM -->

                    <form method="POST">

                        {% csrf_token %}


                        <!-- USERNAME -->

                        <div class="mb-4">

                            <label class="form-label">
                                Username
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                placeholder="Enter your username"
                                required
                            >

                        </div>


                        <!-- PASSWORD -->

                        <div class="mb-4">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter your password"
                                required
                            >

                        </div>


                        <!-- LOGIN -->

                        <button
                            type="submit"
                            class="btn login-btn w-100"
                        >
                            🔓 Login
                        </button>

                    </form>


                    <!-- REGISTER -->

                    <p class="text-center mt-4 mb-0 register-text">

                        Don't have an account?

                        <a
                            href="{% url 'register' %}"
                            class="register-link"
                        >
                            Register
                        </a>

                    </p>


                    <div class="secure-text">
                        🔒 Secure login • Vanshuuu Store
                    </div>


                </div>

            </div>

        </div>

    </div>

</div>


</body>

</html>
