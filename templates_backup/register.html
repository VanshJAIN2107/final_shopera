<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | Vanshuuu Store</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #fff;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(circle at 20% 20%, #3b0000 0%, transparent 35%),
                radial-gradient(circle at 85% 80%, #260000 0%, transparent 35%),
                #050505;
        }

        /* Background glow */

        body::before {
            content: "";
            position: fixed;

            width: 350px;
            height: 350px;

            background: #dc2626;
            border-radius: 50%;

            filter: blur(160px);
            opacity: 0.12;

            top: -120px;
            right: -100px;

            z-index: -1;
        }

        /* Main Card */

        .register-card {
            width: 100%;
            max-width: 500px;

            padding: 40px 35px;

            background: rgba(18, 18, 18, 0.9);

            border: 1px solid rgba(220, 38, 38, 0.4);
            border-radius: 25px;

            box-shadow:
                0 0 35px rgba(220, 38, 38, 0.12),
                0 25px 70px rgba(0, 0, 0, 0.7);

            backdrop-filter: blur(15px);

            animation: cardAppear 0.6s ease;
        }

        @keyframes cardAppear {

            from {
                opacity: 0;
                transform: translateY(25px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }

        /* Logo */

        .logo {
            text-align: center;
            font-size: 25px;
            font-weight: 800;
            margin-bottom: 25px;
        }

        .logo span {
            color: #ef4444;
        }

        /* Heading */

        .register-title {
            text-align: center;
            font-size: 32px;
            font-weight: 800;

            margin-bottom: 8px;

            background: linear-gradient(
                90deg,
                #fff,
                #ff5555,
                #dc2626
            );

            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 28px;
        }

        /* Messages */

        .alert {
            background: rgba(220, 38, 38, 0.12);
            border: 1px solid rgba(220, 38, 38, 0.4);
            color: #ff7777;
            border-radius: 10px;
        }

        /* Labels */

        .form-label {
            color: #ddd;
            font-weight: 600;
        }

        /* Inputs */

        .form-control {
            height: 48px;

            background: #0c0c0c;
            color: #fff;

            border: 1px solid #383838;
            border-radius: 10px;

            padding: 10px 14px;

            transition: 0.3s;
        }

        .form-control::placeholder {
            color: #666;
        }

        .form-control:focus {
            background: #111;
            color: #fff;

            border-color: #dc2626;

            box-shadow:
                0 0 12px rgba(220, 38, 38, 0.2);
        }

        /* Register Button */

        .register-btn {
            width: 100%;
            height: 50px;

            margin-top: 8px;

            border: none;
            border-radius: 11px;

            background: linear-gradient(
                135deg,
                #ef4444,
                #b91c1c
            );

            color: #fff;
            font-size: 16px;
            font-weight: 700;

            box-shadow:
                0 8px 22px rgba(220, 38, 38, 0.3);

            transition: 0.3s ease;
        }

        .register-btn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 12px 30px rgba(220, 38, 38, 0.5);
        }

        /* Login */

        .login-text {
            color: #888;
        }

        .login-link {
            color: #ff5555;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link:hover {
            color: #ff7777;
            text-decoration: underline;
        }

        .terms {
            text-align: center;
            color: #555;
            font-size: 12px;
            margin-top: 25px;
        }

        @media (max-width: 576px) {

            body {
                padding: 20px;
            }

            .register-card {
                padding: 32px 22px;
            }

            .register-title {
                font-size: 28px;
            }

        }

    </style>

</head>

<body>

    <div class="register-card">

        <div class="logo">
            Vanshuuu <span>Store</span>
        </div>

        <h2 class="register-title">
            Create Account
        </h2>

        <p class="subtitle">
            Join Vanshuuu Store today
        </p>


        <!-- Messages -->

        {% for message in messages %}

            <div class="alert mb-3">
                {{ message }}
            </div>

        {% endfor %}


        <!-- Register Form -->

        <form method="POST">

            {% csrf_token %}


            <div class="mb-3">

                <label class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter username"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter email"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Create password"
                    required
                >

            </div>


            <div class="mb-4">

                <label class="form-label">
                    Confirm Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    class="form-control"
                    placeholder="Confirm password"
                    required
                >

            </div>


            <button
                type="submit"
                class="register-btn"
            >
                🚀 Create Account
            </button>

        </form>


        <p class="text-center mt-4 mb-0 login-text">

            Already have an account?

            <a
                href="{% url 'login' %}"
                class="login-link"
            >
                Login
            </a>

        </p>


        <div class="terms">
            Welcome to Vanshuuu Store
        </div>

    </div>

</body>

</html>
