<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something went wrong | Vanshora</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               background: #faf7f2; color: #2b2522; font-family: -apple-system, 'Segoe UI', Arial, sans-serif; }
        .box { max-width: 480px; margin: 20px; padding: 44px 32px; text-align: center; background: #fff;
               border: 1px solid #e8dfd0; border-radius: 20px; box-shadow: 0 8px 24px rgba(59,47,42,.10); }
        .code { font-family: Georgia, 'Playfair Display', serif; font-size: 90px; font-weight: 800; line-height: 1; color: #b8864b; }
        h1 { font-family: Georgia, serif; font-size: 26px; margin: 14px 0 8px; }
        p { color: #7c7168; line-height: 1.6; margin: 0 0 24px; }
        a { display: inline-block; padding: 12px 26px; border-radius: 999px; background: #3b2f2a; color: #fff;
            font-weight: 700; text-decoration: none; }
        a:hover { background: #221a16; }
        small { display: block; margin-top: 18px; color: #7c7168; }
    </style>
</head>
<body>
    <div class="box">
        <div class="code">500</div>
        <h1>Something went wrong on our side</h1>
        <p>We hit an unexpected problem. It is not your fault, and we are working on it.</p>
        <a href="/">Back to home</a>
        <small>Please try again in a few minutes.</small>
    </div>
</body>
</html>
