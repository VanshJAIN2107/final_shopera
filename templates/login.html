<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - {{ site_name }}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body { display: flex; flex-direction: column; }

        .auth-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 16px;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            padding: 40px 36px;
            box-shadow: var(--shadow-md);
        }

        .auth-card .subtitle { color: var(--muted); font-size: 14px; }

        .auth-link { color: var(--accent); font-weight: 700; text-decoration: none; }
        .auth-link:hover { color: var(--primary); text-decoration: underline; }

        .secure-text {
            color: var(--muted);
            font-size: 12px;
            text-align: center;
            margin-top: 20px;
        }

        @media (max-width: 576px) {
            .auth-main { padding: 28px 12px; }
            .auth-card { padding: 28px 20px; }
        }
    </style>

    {% include 'partials/theme.html' %}

</head>


<body>

{% include 'partials/navbar.html' with active='login' %}

<main class="auth-main">

    <div class="surface auth-card">

        <h2 class="text-center mb-1">Welcome Back</h2>

        <p class="subtitle text-center mb-4">
            Login to continue shopping
        </p>


        <!-- FORM -->

        <form method="POST">

            {% csrf_token %}

            <input type="hidden" name="next" value="{{ next }}">


            <!-- USERNAME -->

            <div class="mb-3">

                <label class="form-label">
                    Username or email
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter your username or email"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="mb-4">

                <div class="d-flex justify-content-between align-items-baseline">
                    <label class="form-label">
                        Password
                    </label>
                    <a href="{% url 'password_reset' %}" class="auth-link small">Forgot password?</a>
                </div>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <!-- LOGIN -->

            <button
                type="submit"
                class="btn-theme w-100"
            >
                Login
            </button>

        </form>


        <!-- REGISTER -->

        <p class="text-center mt-4 mb-0 text-muted">

            Don't have an account?

            <a
                href="{% url 'register' %}"
                class="auth-link"
            >
                Register
            </a>

        </p>


        <div class="secure-text">
            Secure login &bull; {{ site_name }}
        </div>

    </div>

</main>

{% include 'partials/footer.html' %}

</body>

</html>
