<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}{{ site_name }}{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}{{ site_name }}: quality products at great prices with free delivery and cash on delivery.{% endblock %}">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    {% block extra_css %}{% endblock %}

    {% include 'partials/theme.html' %}
</head>

<body>

{% include 'partials/navbar.html' with active=nav_active|default:'' %}

<main>
    {% block content %}{% endblock %}
</main>

{% include 'partials/footer.html' %}

{% block extra_js %}{% endblock %}

</body>

</html>
