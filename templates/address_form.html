{% extends 'base.html' %}

{% block title %}{% if address %}Edit address{% else %}Add address{% endif %} | {{ site_name }}{% endblock %}

{% block extra_css %}
<style>
    .af-wrap { max-width: 680px; margin: 0 auto; padding: 36px 16px 0; }
    .af-card { padding: 32px; }
    @media (max-width: 576px) { .af-card { padding: 22px 18px; } }
</style>
{% endblock %}

{% block content %}
<div class="af-wrap">
    <h1 class="mb-4" style="font-size:32px;font-weight:800;">{% if address %}Edit address{% else %}Add new address{% endif %}</h1>

    <div class="surface af-card">
        <form method="POST" action="{% if address %}{% url 'address_edit' address.id %}{% else %}{% url 'address_add' %}{% endif %}">
            {% csrf_token %}

            <div class="row g-3">
                <div class="col-sm-6">
                    <label class="form-label" for="full_name">Full name</label>
                    <input type="text" id="full_name" name="full_name" class="form-control" required
                           value="{% if form %}{{ form.full_name }}{% else %}{{ address.full_name }}{% endif %}">
                </div>
                <div class="col-sm-6">
                    <label class="form-label" for="phone">Phone</label>
                    <input type="tel" id="phone" name="phone" class="form-control" required
                           value="{% if form %}{{ form.phone }}{% else %}{{ address.phone }}{% endif %}">
                </div>
                <div class="col-12">
                    <label class="form-label" for="line">Address (house no, street, area)</label>
                    <textarea id="line" name="line" rows="3" class="form-control" required>{% if form %}{{ form.line }}{% else %}{{ address.line }}{% endif %}</textarea>
                </div>
                <div class="col-sm-5">
                    <label class="form-label" for="city">City</label>
                    <input type="text" id="city" name="city" class="form-control" required
                           value="{% if form %}{{ form.city }}{% else %}{{ address.city }}{% endif %}">
                </div>
                <div class="col-sm-4">
                    <label class="form-label" for="state">State</label>
                    <select id="state" name="state" class="form-select" required>
                        <option value="">Select state</option>
                        {% for st in states %}
                            <option value="{{ st }}"{% if form %}{% if form.state == st %} selected{% endif %}{% elif address.state == st %} selected{% endif %}>{{ st }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-sm-3">
                    <label class="form-label" for="pincode">Pincode</label>
                    <input type="text" id="pincode" name="pincode" class="form-control" required inputmode="numeric"
                           value="{% if form %}{{ form.pincode }}{% else %}{{ address.pincode }}{% endif %}">
                </div>
                <div class="col-12">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="is_default" name="is_default" value="on"
                               {% if form %}{% if form.is_default %}checked{% endif %}{% elif address.is_default %}checked{% endif %}>
                        <label class="form-check-label" for="is_default">Make this my default address</label>
                    </div>
                </div>
            </div>

            <div class="d-flex flex-wrap gap-2 mt-4">
                <button type="submit" class="btn-theme">{% if address %}Save changes{% else %}Save address{% endif %}</button>
                <a href="{% url 'address_list' %}" class="btn-theme-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
