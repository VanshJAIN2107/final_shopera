{% extends 'base.html' %}

{% block title %}Password updated | {{ site_name }}{% endblock %}

{% block extra_css %}
<style>
    .auth-main { display: flex; justify-content: center; padding: 56px 16px; }
    .auth-card { width: 100%; max-width: 460px; padding: 40px 36px; text-align: center; box-shadow: var(--shadow-md); }
    .auth-icon { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 50%; background: var(--success-soft); color: var(--success); display: flex; align-items: center; justify-content: center; font-size: 30px; }
    @media (max-width: 576px) { .auth-main { padding: 28px 12px; } .auth-card { padding: 28px 20px; } }
</style>
{% endblock %}

{% block content %}
<div class="auth-main">
    <div class="surface auth-card">
        <div class="auth-icon">&#10003;</div>
        <h2 class="mb-2">Password updated</h2>
        <p class="text-muted">Your password has been set. You can now log in with your new password.</p>
        <a href="{% url 'login' %}" class="btn-theme mt-2">Go to login</a>
    </div>
</div>
{% endblock %}
